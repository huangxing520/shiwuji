name: Flutter Android 自动构建 & 发布

# 触发规则：
# - 推送 v 开头的标签（如 v1.0.0）自动构建并发布 Release
# - 推送到 main / PR：只跑静态检查与测试门禁，不构建发布
on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  # 前置门禁：静态分析 + 单元测试。build-release 依赖本 job，
  # 任一失败则不会产出 APK，避免「测试退化无人察觉」。
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.2
          channel: stable

      - name: 获取 Flutter 依赖
        run: flutter pub get

      # 以 error 级为门禁：当前仓库存在若干历史 warning/info（死代码、过时 API），
      # 待 P2 清理后再收紧为 --fatal-warnings。
      # BUGSNAG key 经编译期 --dart-define 注入，测试/分析无需任何 env 文件。
      - name: 静态分析
        run: flutter analyze --no-pub --no-fatal-warnings --no-fatal-infos

      - name: 运行测试
        run: flutter test

  build-release:
    needs: verify
    # 仅在打 tag 或手动触发时构建发布；main 分支/PR 只跑上面的 verify。
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write          # 允许创建 Release
    steps:
      # 1. 拉取项目代码
      - name: 拉取代码
        uses: actions/checkout@v4
      # 3. 配置 Java 环境（Android 必须）
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'  # Eclipse Temurin (Adoptium)，稳定可靠
          java-version: '17'
          cache: 'gradle'  # 缓存Gradle依赖，加速构建
      # 2. 配置 Flutter 环境 🔴【唯一需要修改的地方：Flutter 版本】
      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          # 👇 替换成你本地使用的 Flutter 版本（必填）
          flutter-version: 3.44.2
          channel: stable

      
      # 4. 安装项目依赖
      - name: 获取 Flutter 依赖
        run: flutter pub get

      # 5. 配置签名文件（自动从 GitHub 密钥读取，无需手动上传）
      - name: 生成签名文件
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          # 用 printf 避免换行；先校验 secret 非空
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret 未设置"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/keystore.jks
          if [ ! -s app/keystore.jks ]; then
            echo "::error::keystore.jks 解码后为空文件，请检查 KEYSTORE_BASE64 是否为有效 base64"
            exit 1
          fi
          printf 'storeFile=keystore.jks\n' > key.properties
          printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD" >> key.properties
          printf 'keyAlias=%s\n' "$KEY_ALIAS" >> key.properties
          printf 'keyPassword=%s\n' "$KEY_PASSWORD" >> key.properties

      # 6. 构建 Release 版 APK
      # BUGSNAG_API_KEY 经编译期 --dart-define 注入，不再需要 .env 资源文件；
      # 未配置 secret 时 key 为空串，Bugsnag 自动跳过，不影响构建。
      - name: 编译生成 APK
        env:
          BUGSNAG_API_KEY: ${{ secrets.BUGSNAG_API_KEY }}
        run: flutter build apk --split-per-abi --dart-define=BUGSNAG_API_KEY="$BUGSNAG_API_KEY"

      # 7. 自动发布到 GitHub Release
      - name: 发布 APK
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}